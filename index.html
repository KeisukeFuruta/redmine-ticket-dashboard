<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14110f;
    --surface:#1e1a17;
    --surface-2:#262220;
    --border:#34302b;
    --track:#383835;
    --text:#f2ede7;
    --text-secondary:#c3c2b7;
    --text-muted:#898781;
    --accent:#c1583a;
    --status-progress:#3987e5;
    --status-progress-bg:rgba(57,135,229,0.18);
    --status-progress-text:#8ec2f5;
    --status-review:#c98500;
    --status-review-bg:rgba(201,133,0,0.18);
    --status-review-text:#e3b04d;
    --status-done:#199e70;
    --status-done-bg:rgba(25,158,112,0.18);
    --status-done-text:#5fce9e;
    --status-todo-bg:rgba(137,135,129,0.16);
    --critical:#d03b3b;
    --critical-bg:rgba(208,59,59,0.18);
    --critical-text:#ea8683;
    --warning:#fab219;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;}
  a{color:var(--status-progress);}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .page{max-width:1440px;margin:0 auto;padding:32px;}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:24px;flex-wrap:wrap;}
  .redmine-menu{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto;}
  .menu-item{display:inline-flex;align-items:center;padding:10px 14px;font-size:13px;color:var(--text-muted);border-bottom:2px solid transparent;white-space:nowrap;}
  .menu-item.active{color:var(--text);font-weight:600;border-bottom-color:var(--accent);}
  .menu-item[data-tab]{cursor:pointer;}
  .menu-item[data-tab]:hover{color:var(--text-secondary);}
  .gantt-focus .gt-status,.gantt-focus .gt-priority,.gantt-focus .gt-due{display:none;}
  .gantt-focus .gt-title{width:360px;}
  .title{margin:0;font-size:22px;font-weight:700;color:var(--text);letter-spacing:-0.01em;}
  .subtitle{margin:4px 0 0;font-size:13px;color:var(--text-muted);}
  .topbar-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
  .timestamp{font-size:11px;color:var(--text-muted);}
  .segmented{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:3px;gap:2px;margin-top:4px;}
  .seg-btn{border:none;background:transparent;color:var(--text-secondary);font-family:inherit;font-size:12px;font-weight:600;padding:6px 14px;border-radius:4px;cursor:pointer;}
  .seg-btn.active{background:var(--accent);color:#1c1512;}
  .role-caption{font-size:10.5px;color:var(--text-muted);}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;}
  .grid + .grid{margin-top:24px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,0.35);}
  .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
  .card-title{font-size:14px;font-weight:600;color:var(--text);}
  .count-badge{font-size:11px;font-weight:600;color:var(--text-secondary);background:var(--surface-2);border-radius:10px;padding:2px 9px;}
  .critical-badge{font-size:11px;font-weight:600;color:var(--critical-text);background:var(--critical-bg);border-radius:10px;padding:2px 9px;}

  .filter-wrap{position:relative;display:inline-flex;align-items:center;}
  .filter-select{appearance:none;-webkit-appearance:none;background:var(--surface-2);border:1px solid var(--border);color:var(--text-secondary);font-family:inherit;font-size:12px;font-weight:500;padding:6px 26px 6px 10px;border-radius:6px;cursor:pointer;}
  .filter-select:focus{outline:1px solid var(--accent);}
  .filter-chevron{position:absolute;right:9px;top:50%;margin-top:-3px;pointer-events:none;color:var(--text-muted);}
  .filter-static{font-size:12px;color:var(--text-muted);}

  .id-cell{color:var(--text-muted);font-size:12px;white-space:nowrap;}
  .badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap;}
  .badge-todo{background:var(--status-todo-bg);color:var(--text-secondary);}
  .badge-progress{background:var(--status-progress-bg);color:var(--status-progress-text);}
  .badge-review{background:var(--status-review-bg);color:var(--status-review-text);}
  .badge-done{background:var(--status-done-bg);color:var(--status-done-text);}
  .priority{display:inline-flex;align-items:center;gap:7px;color:var(--text-secondary);white-space:nowrap;}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;}
  .dot-high{background:var(--critical);}
  .dot-mid{background:var(--warning);}
  .dot-low{background:var(--text-muted);}
  .due{color:var(--text-secondary);white-space:nowrap;}
  .due-overdue{color:var(--critical-text);font-weight:600;white-space:nowrap;}

  .alert-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
  .alert-item:last-child{border-bottom:none;}
  .alert-left{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .alert-title{font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .empty-state{font-size:12.5px;color:var(--text-muted);padding:12px 0;}

  .gt-id{width:52px;flex-shrink:0;}
  .gt-title{width:196px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .gt-assignee{width:56px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .gt-status{width:84px;flex-shrink:0;}
  .gt-priority{width:52px;flex-shrink:0;}
  .gt-due{width:60px;flex-shrink:0;}
  .gt-header{display:flex;align-items:flex-end;gap:12px;padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid var(--border);}
  .gt-th{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;}
  .gt-axis{flex:1;position:relative;height:14px;}
  .gt-tick{position:absolute;top:0;transform:translateX(-50%);font-size:10px;color:var(--text-muted);white-space:nowrap;}
  .gt-tick:first-child{transform:translateX(0);}
  .gt-tick:last-child{transform:translateX(-100%);}
  .gt-tick.today{color:var(--text);font-weight:600;}
  .gt-body{min-height:40px;}
  .gt-row{display:flex;align-items:center;gap:12px;height:40px;border-bottom:1px solid var(--border);}
  .gt-row:last-child{border-bottom:none;}
  .gt-title-text{color:var(--text);}
  .gt-title-text.child{color:var(--text-secondary);font-size:12.5px;}
  .gt-assignee{color:var(--text-secondary);}
  .tree-marker{color:var(--text-muted);margin-right:2px;}
  .gt-track{flex:1;position:relative;height:18px;}
  .gt-bar{position:absolute;top:0;height:100%;border-radius:3px;overflow:hidden;}
  .gantt-fill{position:absolute;top:0;left:0;height:100%;border-radius:3px 0 0 3px;background:var(--accent);}
  .today-line{position:absolute;top:-11px;bottom:-11px;left:50%;width:1px;background:var(--text-secondary);opacity:0.45;}

  .legend{display:flex;align-items:center;gap:14px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);}
  .legend-sw{width:8px;height:8px;border-radius:2px;display:inline-block;}

  .member-row{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--border);}
  .member-row:last-child{border-bottom:none;}
  .member-name{width:104px;flex-shrink:0;}
  .member-name .name{font-size:13px;font-weight:500;color:var(--text);display:block;}
  .member-name .level{font-size:10.5px;color:var(--text-muted);display:block;margin-top:2px;}
  .member-bars{flex:1;display:flex;flex-direction:column;gap:5px;}
  .bar-line{display:flex;align-items:center;gap:8px;}
  .bar-track{flex:1;height:8px;border-radius:3px;background:var(--surface-2);position:relative;}
  .bar-fill{position:absolute;top:0;left:0;height:100%;border-radius:3px;}
  .bar-value{width:30px;text-align:right;font-size:11px;color:var(--text-muted);flex-shrink:0;}
  .load-footnote{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted);}

  .donut-row{display:flex;justify-content:space-around;align-items:flex-start;padding:4px 0 16px;}
  .donut-item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .donut-wrap{position:relative;width:88px;height:88px;}
  .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .donut-pct{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;color:var(--text);}
  .donut-pct-label{font-size:9px;color:var(--text-muted);margin-top:2px;}
  .donut-caption{font-size:13px;font-weight:600;color:var(--text);}
  .donut-sub{font-size:11px;color:var(--text-muted);margin-top:-4px;}
  .donut-legend{display:flex;justify-content:center;gap:16px;padding-top:14px;border-top:1px solid var(--border);}

  /* 次にやるべきタスク(メンバー画面専用) */
  .next-task-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
  .next-task-item:last-child{border-bottom:none;}
  .next-rank{width:20px;height:20px;border-radius:50%;background:var(--surface-2);color:var(--text-secondary);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .next-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .next-title-row{display:flex;align-items:center;gap:8px;}
  .next-title{font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .next-meta{display:flex;align-items:center;gap:12px;font-size:11px;}
  .reason-tag{font-size:10.5px;color:var(--text-muted);background:var(--surface-2);border-radius:10px;padding:2px 8px;white-space:nowrap;flex-shrink:0;}

  /* 優先度別集計(レビュワー画面専用) */
  .priority-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
  .priority-row:last-child{border-bottom:none;}
  .priority-row .priority{width:48px;flex-shrink:0;}
  .priority-count{width:32px;flex-shrink:0;color:var(--text-secondary);font-size:12px;}
  .priority-rate{width:96px;flex-shrink:0;text-align:right;color:var(--text-muted);font-size:11px;}

  @media (max-width:900px){
    .grid > .card{grid-column:span 12 !important;}
  }
</style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <div>
      <h1 class="title">Ticket Dashboard</h1>
      <p class="subtitle">Redmineチケット集計 · 社内基幹システム刷新プロジェクト</p>
    </div>
    <div class="topbar-right">
      <span class="timestamp mono">最終更新 09/11 10:30</span>
      <div class="segmented" role="group" aria-label="表示切替">
        <button id="btn-member" class="seg-btn" aria-pressed="true">メンバー視点</button>
        <button id="btn-reviewer" class="seg-btn" aria-pressed="false">レビュワー視点</button>
      </div>
      <span class="role-caption">※本来はログイン時に決まるロール(デモのため切替可能)</span>
    </div>
  </div>

  <nav class="redmine-menu">
    <span class="menu-item active" id="tab-dashboard" data-tab="dashboard">ダッシュボード</span>
    <span class="menu-item">概要</span>
    <span class="menu-item">活動</span>
    <span class="menu-item">ロードマップ</span>
    <span class="menu-item" id="tab-issues" data-tab="issues">課題</span>
    <span class="menu-item" id="tab-gantt" data-tab="gantt">ガントチャート</span>
    <span class="menu-item">カレンダー</span>
    <span class="menu-item">ニュース</span>
    <span class="menu-item">Wiki</span>
    <span class="menu-item">ファイル</span>
    <span class="menu-item">設定</span>
  </nav>

  <!-- Row1: チケット一覧 + ガントチャート(常時表示) -->
  <div class="grid">
    <div class="card" id="ticket-card" style="grid-column:span 12;">
      <div class="card-header">
        <span class="card-title" id="ticket-card-title">チケット一覧</span>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="filter-wrap" id="filter-wrap"></div>
          <span class="count-badge" id="ticket-count">0件</span>
        </div>
      </div>

      <div class="gt-header">
        <span class="gt-th gt-id">ID</span>
        <span class="gt-th gt-title">タイトル</span>
        <span class="gt-th gt-assignee">担当者</span>
        <span class="gt-th gt-status">ステータス</span>
        <span class="gt-th gt-priority">優先度</span>
        <span class="gt-th gt-due">期限</span>
        <div class="gt-axis" id="gt-axis"></div>
      </div>

      <div class="gt-body" id="ticket-rows"></div>
    </div>
  </div>

  <!-- Row2: 期限超過アラート(常時) + ロール別ウィジェット -->
  <div class="grid" id="row2">
    <div class="card" id="alerts-card" style="grid-column:span 4;">
      <div class="card-header">
        <span class="card-title">期限超過アラート</span>
        <span class="critical-badge" id="overdue-count">0件</span>
      </div>
      <div id="overdue-list"></div>
    </div>

    <!-- メンバー専用 -->
    <div class="card" id="next-task-card" style="grid-column:span 8;">
      <div class="card-header">
        <span class="card-title">次にやるべきタスク</span>
        <span class="count-badge" id="next-task-count">0件</span>
      </div>
      <div id="next-task-list"></div>
    </div>

    <!-- レビュワー専用 -->
    <div class="card" id="member-load-card" style="grid-column:span 4;">
      <div class="card-header">
        <span class="card-title">メンバー別負荷</span>
        <div class="legend">
          <span class="legend-item"><span class="legend-sw" style="background:var(--text-secondary);"></span>件数</span>
          <span class="legend-item"><span class="legend-sw" style="background:var(--accent);"></span>負荷</span>
        </div>
      </div>
      <div id="member-load-rows"></div>
      <div class="load-footnote">負荷 = 件数 × 経験係数(ベテラン0.7 / 中堅1.0 / 新人1.5)</div>
    </div>
    <div class="card" id="priority-summary-card" style="grid-column:span 4;">
      <div class="card-header">
        <span class="card-title">優先度別集計</span>
      </div>
      <div id="priority-summary-rows"></div>
    </div>
  </div>

  <!-- Row3: バージョン別進捗(常時) -->
  <div class="grid" id="row3">
    <div class="card" style="grid-column:span 12;">
      <div class="card-header">
        <span class="card-title">バージョン別進捗</span>
      </div>
      <div class="donut-row" id="donut-row"></div>
      <div class="donut-legend">
        <span class="legend-item"><span class="legend-sw" style="background:#199e70;"></span>完了</span>
        <span class="legend-item"><span class="legend-sw" style="background:#3987e5;"></span>進行中</span>
        <span class="legend-item"><span class="legend-sw" style="background:#898781;"></span>未着手</span>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  'use strict';

  // ---- dummy data -----------------------------------------------------

  var TODAY = new Date(2026, 8, 11); // 2026-09-11 固定(デモ用)
  var AXIS_START = new Date(2026, 8, 4);
  var AXIS_END = new Date(2026, 8, 18);
  var SPAN_DAYS = daysBetween(AXIS_START, AXIS_END);

  var MEMBERS = [
    { id:'tanaka',     name:'田中', level:'senior', weight:0.7 },
    { id:'sato',       name:'佐藤', level:'mid',    weight:1.0 },
    { id:'suzuki',     name:'鈴木', level:'mid',    weight:1.0 },
    { id:'takahashi',  name:'高橋', level:'junior', weight:1.5 },
    { id:'ito',        name:'伊藤', level:'senior', weight:0.7 }
  ];
  var LEVEL_LABEL = { senior:'ベテラン', mid:'中堅', junior:'新人' };

  // メンバー別チケット数(ダッシュボード集計上の全チケット数。下のTICKETSは一覧に表示する代表サンプル)
  var MEMBER_TICKET_COUNTS = { tanaka:8, sato:6, suzuki:7, takahashi:4, ito:9 };

  var STATUS = {
    todo:        { label:'未着手',   badge:'badge-todo',     bar:'var(--text-muted)' },
    in_progress: { label:'進行中',   badge:'badge-progress', bar:'var(--status-progress)' },
    review:      { label:'レビュー中', badge:'badge-review',  bar:'var(--status-review)' },
    done:        { label:'完了',     badge:'badge-done',     bar:'var(--status-done)' }
  };
  var PRIORITY = {
    high: { label:'高', dot:'dot-high' },
    mid:  { label:'中', dot:'dot-mid' },
    low:  { label:'低', dot:'dot-low' }
  };

  var TICKETS = [
    { id:1023, title:'ログイン画面のバリデーション修正',   assignee:'tanaka',    status:'in_progress', priority:'high', due:d(2026,9,12), start:d(2026,9,5),  end:d(2026,9,12), progress:0.70, parentId:null },
    { id:1024, title:'入力チェックロジック実装',           assignee:'tanaka',    status:'done',        priority:null,   due:d(2026,9,8),  start:d(2026,9,5),  end:d(2026,9,8),  progress:1,    parentId:1023 },
    { id:1025, title:'エラーメッセージ文言統一',           assignee:'tanaka',    status:'in_progress', priority:null,   due:d(2026,9,11), start:d(2026,9,8),  end:d(2026,9,11), progress:0.5,  parentId:1023 },
    { id:1026, title:'単体テスト作成',                     assignee:'tanaka',    status:'todo',        priority:null,   due:d(2026,9,12), start:d(2026,9,10), end:d(2026,9,12), progress:0,    parentId:1023 },
    { id:1019, title:'会員登録フォームの不具合対応',        assignee:'tanaka',    status:'in_progress', priority:'mid',  due:d(2026,9,9),  start:d(2026,9,4),  end:d(2026,9,9),  progress:0.6,  parentId:null },
    { id:1031, title:'APIレスポンスのキャッシュ対応',       assignee:'sato',      status:'review',      priority:'mid',  due:d(2026,9,15), start:d(2026,9,9),  end:d(2026,9,15), progress:0.8,  parentId:null },
    { id:1042, title:'ダッシュボード用集計バッチ作成',      assignee:'suzuki',    status:'todo',        priority:'mid',  due:d(2026,9,18), start:d(2026,9,13), end:d(2026,9,18), progress:0,    parentId:null },
    { id:1008, title:'通知メールテンプレート更新',          assignee:'takahashi', status:'done',        priority:'low',  due:d(2026,9,5),  start:d(2026,9,4),  end:d(2026,9,5),  progress:1,    parentId:null },
    { id:1050, title:'検索機能のパフォーマンス改善',        assignee:'ito',       status:'in_progress', priority:'high', due:d(2026,9,10), start:d(2026,9,6),  end:d(2026,9,10), progress:0.4,  parentId:null },
    { id:997,  title:'バッチ処理のエラーハンドリング修正',  assignee:'suzuki',    status:'in_progress', priority:'high', due:d(2026,9,8),  start:d(2026,9,3),  end:d(2026,9,8),  progress:0.5,  parentId:null },
    { id:1012, title:'API仕様書の更新',                     assignee:'takahashi', status:'in_progress', priority:'mid',  due:d(2026,9,6),  start:d(2026,9,2),  end:d(2026,9,6),  progress:0.3,  parentId:null }
  ];

  var VERSIONS = [
    { name:'v2.4.0', total:42, done:0.65, inProgress:0.25, todo:0.10 },
    { name:'v2.5.0', total:58, done:0.30, inProgress:0.40, todo:0.30 },
    { name:'v2.6.0', total:21, done:0.05, inProgress:0.15, todo:0.80 }
  ];

  function d(y,m,day){ return new Date(y, m-1, day); }
  function daysBetween(a,b){ return Math.round((b-a)/86400000); }
  function fmtDue(date){ return (date.getMonth()+1)+'/'+date.getDate(); }

  function pct(date){
    var clamped = date < AXIS_START ? AXIS_START : (date > AXIS_END ? AXIS_END : date);
    return daysBetween(AXIS_START, clamped) / SPAN_DAYS * 100;
  }

  function isOverdue(t){
    return t.status !== 'done' && t.due < TODAY;
  }
  function overdueDays(t){
    return daysBetween(t.due, TODAY);
  }
  function byId(id){
    for(var i=0;i<TICKETS.length;i++){ if(TICKETS[i].id===id) return TICKETS[i]; }
    return null;
  }
  function hasChildren(id){
    return TICKETS.some(function(t){ return t.parentId === id; });
  }

  // ---- state ------------------------------------------------------------

  var state = { viewMode:'member', filter:'tanaka', activeTab:'dashboard' };
  var TAB_TITLE = { dashboard:'チケット一覧', issues:'課題一覧', gantt:'ガントチャート' };

  // ---- rendering ----------------------------------------------------------

  function memberName(id){
    var m = MEMBERS.filter(function(x){ return x.id===id; })[0];
    return m ? m.name : id;
  }

  function visibleTickets(){
    if(state.filter === 'all') return TICKETS;
    return TICKETS.filter(function(t){ return t.assignee === state.filter; });
  }

  function renderAxis(){
    var axis = document.getElementById('gt-axis');
    var html = '';
    for(var day=0; day<=SPAN_DAYS; day++){
      var date = new Date(AXIS_START.getTime() + day*86400000);
      var isToday = daysBetween(AXIS_START, TODAY) === day;
      html += '<span class="gt-tick' + (isToday?' today':'') + '" style="left:' + (day/SPAN_DAYS*100) + '%;">' + fmtDue(date) + '</span>';
    }
    axis.innerHTML = html;
  }

  function renderFilter(){
    var wrap = document.getElementById('filter-wrap');
    if(state.viewMode === 'member'){
      wrap.innerHTML = '<span class="filter-static">担当者: 自分(田中)</span>';
      return;
    }
    var opts = '<option value="all"' + (state.filter==='all'?' selected':'') + '>全員</option>';
    MEMBERS.forEach(function(m){
      opts += '<option value="' + m.id + '"' + (state.filter===m.id?' selected':'') + '>' + m.name + '</option>';
    });
    wrap.innerHTML =
      '<select class="filter-select" id="assignee-select" aria-label="担当者フィルタ">' + opts + '</select>' +
      '<svg class="filter-chevron" width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    document.getElementById('assignee-select').addEventListener('change', function(e){
      state.filter = e.target.value;
      render();
    });
  }

  function renderTicketRows(){
    var list = visibleTickets();
    document.getElementById('ticket-count').textContent = list.length + '件';

    var html = '';
    list.forEach(function(t){
      var isChild = t.parentId !== null;
      var st = STATUS[t.status];
      var pr = t.priority ? PRIORITY[t.priority] : null;
      var overdue = isOverdue(t);
      var left = pct(t.start);
      var width = Math.max(pct(t.end) - left, 1.5);

      var barInner = '';
      if(!isChild && t.progress > 0 && t.progress < 1 && t.status !== 'done'){
        barInner = '<div class="gantt-fill" style="width:' + (t.progress*100) + '%;"></div>';
      }
      var barStyle = 'left:' + left + '%;width:' + width + '%;background:' + (barInner ? 'var(--track)' : st.bar) + ';';
      if(overdue) barStyle += 'border:1px solid var(--critical);';

      html += '<div class="gt-row">' +
        '<span class="gt-id id-cell mono">' + (isChild ? '' : '#' + t.id) + '</span>' +
        '<span class="gt-title"><span class="gt-title-text' + (isChild?' child':'') + '"' + (isChild?'':' style="font-weight:600;"') + '>' +
          (isChild ? '<span class="tree-marker">└</span>#' + t.id + ' ' : '') + t.title +
        '</span></span>' +
        '<span class="gt-assignee"' + (isChild?' style="color:var(--text-muted);"':'') + '>' + memberName(t.assignee) + '</span>' +
        '<span class="gt-status"><span class="badge ' + st.badge + '">' + st.label + '</span></span>' +
        '<span class="gt-priority">' + (pr ? '<span class="priority"><span class="dot ' + pr.dot + '"></span>' + pr.label + '</span>' : '<span style="color:var(--text-muted);">–</span>') + '</span>' +
        '<span class="gt-due ' + (overdue?'due-overdue':'due') + ' mono">' + fmtDue(t.due) + '</span>' +
        '<div class="gt-track"><div class="gt-bar" style="' + barStyle + '">' + barInner + '</div><div class="today-line"></div></div>' +
      '</div>';
    });

    document.getElementById('ticket-rows').innerHTML = html || '<div class="empty-state">該当するチケットがありません</div>';
  }

  function renderOverdue(){
    var list = TICKETS.filter(function(t){
      return isOverdue(t) && (state.filter === 'all' || t.assignee === state.filter);
    }).sort(function(a,b){ return overdueDays(b) - overdueDays(a); });

    var badge = document.getElementById('overdue-count');
    badge.textContent = list.length + '件';
    badge.className = list.length ? 'critical-badge' : 'count-badge';

    if(!list.length){
      document.getElementById('overdue-list').innerHTML = '<div class="empty-state">期限超過のチケットはありません</div>';
      return;
    }
    var html = '';
    list.forEach(function(t){
      html += '<div class="alert-item">' +
        '<div class="alert-left"><span class="id-cell mono">#' + t.id + '</span><span class="alert-title">' + t.title + '</span></div>' +
        '<span class="critical-badge">' + overdueDays(t) + '日超過</span>' +
      '</div>';
    });
    document.getElementById('overdue-list').innerHTML = html;
  }

  function renderMemberLoad(){
    var members = state.filter === 'all' ? MEMBERS : MEMBERS.filter(function(m){ return m.id === state.filter; });
    var maxScale = Math.max.apply(null, MEMBERS.map(function(m){ return MEMBER_TICKET_COUNTS[m.id]; }));

    var html = '';
    members.forEach(function(m){
      var count = MEMBER_TICKET_COUNTS[m.id];
      var load = Math.round(count * m.weight * 10) / 10;
      var countPct = count / maxScale * 100;
      var loadPct = load / maxScale * 100;
      html += '<div class="member-row">' +
        '<div class="member-name"><span class="name">' + m.name + '</span><span class="level">' + LEVEL_LABEL[m.level] + ' ×' + m.weight.toFixed(1) + '</span></div>' +
        '<div class="member-bars">' +
          '<div class="bar-line"><div class="bar-track"><div class="bar-fill" style="width:' + countPct + '%;background:var(--text-secondary);"></div></div><span class="bar-value">' + count + '</span></div>' +
          '<div class="bar-line"><div class="bar-track"><div class="bar-fill" style="width:' + loadPct + '%;background:var(--accent);"></div></div><span class="bar-value">' + load.toFixed(1) + '</span></div>' +
        '</div>' +
      '</div>';
    });
    document.getElementById('member-load-rows').innerHTML = html;
  }

  function renderPrioritySummary(){
    var list = TICKETS.filter(function(t){
      return t.priority && (state.filter === 'all' || t.assignee === state.filter);
    });
    var tiers = ['high','mid','low'];
    var html = '';
    tiers.forEach(function(p){
      var items = list.filter(function(t){ return t.priority === p; });
      var total = items.length;
      var doneCount = items.filter(function(t){ return t.status === 'done'; }).length;
      var rate = total ? Math.round(doneCount/total*100) : 0;
      var rateText = total ? (doneCount + '/' + total + ' (' + rate + '%)') : '該当なし';
      html += '<div class="priority-row">' +
        '<span class="priority"><span class="dot ' + PRIORITY[p].dot + '"></span>' + PRIORITY[p].label + '</span>' +
        '<span class="priority-count mono">' + total + '件</span>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + rate + '%;background:var(--status-done);"></div></div>' +
        '<span class="priority-rate mono">' + rateText + '</span>' +
      '</div>';
    });
    document.getElementById('priority-summary-rows').innerHTML = html;
  }

  function renderNextTasks(){
    var rank = { high:0, mid:1, low:2 };
    var candidates = TICKETS.filter(function(t){
      return t.assignee === state.filter && t.status !== 'done' && !hasChildren(t.id);
    }).map(function(t){
      var parent = t.parentId !== null ? byId(t.parentId) : null;
      var effPriority = t.priority || (parent && parent.priority) || 'mid';
      return { t:t, effPriority:effPriority };
    }).sort(function(a,b){
      if(rank[a.effPriority] !== rank[b.effPriority]) return rank[a.effPriority]-rank[b.effPriority];
      return a.t.due - b.t.due;
    }).slice(0,3);

    document.getElementById('next-task-count').textContent = candidates.length + '件';

    if(!candidates.length){
      document.getElementById('next-task-list').innerHTML = '<div class="empty-state">対応中のタスクはありません</div>';
      return;
    }
    var html = '';
    candidates.forEach(function(c, i){
      var t = c.t;
      var reason;
      if(isOverdue(t)) reason = '期限超過';
      else if(daysBetween(TODAY, t.due) <= 2) reason = '期限が近い';
      else if(c.effPriority === 'high') reason = '優先度: 高';
      else reason = '対応待ち';
      html += '<div class="next-task-item">' +
        '<span class="next-rank">' + (i+1) + '</span>' +
        '<div class="next-body">' +
          '<div class="next-title-row"><span class="id-cell mono">#' + t.id + '</span><span class="next-title">' + t.title + '</span></div>' +
          '<div class="next-meta"><span class="priority"><span class="dot ' + PRIORITY[c.effPriority].dot + '"></span>' + PRIORITY[c.effPriority].label + '</span><span class="due mono">期限 ' + fmtDue(t.due) + '</span></div>' +
        '</div>' +
        '<span class="reason-tag">' + reason + '</span>' +
      '</div>';
    });
    document.getElementById('next-task-list').innerHTML = html;
  }

  function renderDonuts(){
    var CIRC = 2 * Math.PI * 40;
    var html = '';
    VERSIONS.forEach(function(v){
      var doneLen = v.done * CIRC, ipLen = v.inProgress * CIRC, todoLen = v.todo * CIRC;
      html += '<div class="donut-item">' +
        '<div class="donut-wrap"><svg viewBox="0 0 100 100" width="88" height="88">' +
          '<circle cx="50" cy="50" r="40" fill="none" stroke="#2c2c2a" stroke-width="14"/>' +
          '<g transform="rotate(-90 50 50)">' +
            '<circle cx="50" cy="50" r="40" fill="none" stroke="#199e70" stroke-width="14" stroke-dasharray="' + doneLen.toFixed(1) + ' ' + CIRC.toFixed(1) + '" stroke-dashoffset="0"/>' +
            '<circle cx="50" cy="50" r="40" fill="none" stroke="#3987e5" stroke-width="14" stroke-dasharray="' + ipLen.toFixed(1) + ' ' + CIRC.toFixed(1) + '" stroke-dashoffset="-' + doneLen.toFixed(1) + '"/>' +
            '<circle cx="50" cy="50" r="40" fill="none" stroke="#898781" stroke-width="14" stroke-dasharray="' + todoLen.toFixed(1) + ' ' + CIRC.toFixed(1) + '" stroke-dashoffset="-' + (doneLen+ipLen).toFixed(1) + '"/>' +
          '</g>' +
        '</svg><div class="donut-center"><span class="donut-pct">' + Math.round(v.done*100) + '%</span><span class="donut-pct-label">完了</span></div></div>' +
        '<span class="donut-caption">' + v.name + '</span><span class="donut-sub">' + v.total + '件</span>' +
      '</div>';
    });
    document.getElementById('donut-row').innerHTML = html;
  }

  function render(){
    document.getElementById('btn-member').classList.toggle('active', state.viewMode==='member');
    document.getElementById('btn-member').setAttribute('aria-pressed', state.viewMode==='member');
    document.getElementById('btn-reviewer').classList.toggle('active', state.viewMode==='reviewer');
    document.getElementById('btn-reviewer').setAttribute('aria-pressed', state.viewMode==='reviewer');

    renderFilter();
    renderTicketRows();
    renderOverdue();

    var isMember = state.viewMode === 'member';
    document.getElementById('next-task-card').style.display = isMember ? '' : 'none';
    document.getElementById('member-load-card').style.display = isMember ? 'none' : '';
    document.getElementById('priority-summary-card').style.display = isMember ? 'none' : '';

    if(isMember) renderNextTasks();
    else { renderMemberLoad(); renderPrioritySummary(); }

    ['dashboard','issues','gantt'].forEach(function(tab){
      var el = document.getElementById('tab-' + tab);
      if(el) el.classList.toggle('active', state.activeTab === tab);
    });
    var showDashboardExtras = state.activeTab === 'dashboard';
    document.getElementById('row2').style.display = showDashboardExtras ? '' : 'none';
    document.getElementById('row3').style.display = showDashboardExtras ? '' : 'none';
    document.getElementById('ticket-card-title').textContent = TAB_TITLE[state.activeTab];
    document.getElementById('ticket-card').classList.toggle('gantt-focus', state.activeTab === 'gantt');
  }

  document.getElementById('btn-member').addEventListener('click', function(){
    state.viewMode = 'member';
    state.filter = 'tanaka';
    render();
  });
  document.getElementById('btn-reviewer').addEventListener('click', function(){
    state.viewMode = 'reviewer';
    state.filter = 'all';
    render();
  });
  ['dashboard','issues','gantt'].forEach(function(tab){
    var el = document.getElementById('tab-' + tab);
    if(el) el.addEventListener('click', function(){
      state.activeTab = tab;
      render();
    });
  });

  renderAxis();
  renderDonuts();
  render();
})();
</script>
</body>
</html>
